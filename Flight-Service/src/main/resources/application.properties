server.port=9092
spring.application.name=FLIGHT-SERVICE
spring.datasource.url=jdbc:mysql://localhost:3306/flightdb
spring.config.import=configserver:http://localhost:9095

management.health.circuitbreakers.enabled=true
 
#with this configuration, we can access only the /health endpoint.
#management.health.endpoints.web.exposure.include=health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
 
#configure resiliance4j
resilience4j.circuitbreaker.instances.cbflight.register-health-indicator=true
resilience4j.circuitbreaker.instances.cbflight.event-consumer-buffer-size=10
#50%
resilience4j.circuitbreaker.instances.cbflight.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cbflight.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.cbflight.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.cbflight.wait-duration-in-open-state=6s
resilience4j.circuitbreaker.instances.cbflight.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.cbflight.sliding-window-size=10
resilience4j.circuitbreaker.instances.cbflight.sliding-window-type=COUNT_BASED